[project]
name = "job-radar"
version = "0.1.0"
description = "Local-first career opportunity radar"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "rich>=13.7",
    "feedparser>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "pyinstaller>=6.0",
]

[project.scripts]
job-radar = "job_radar.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["job_radar*"]

[tool.setuptools.package-data]
job_radar = ["db/schema.sql", "db/migrations/*.sql", "ui/templates/*.html", "ui/static/*", "source_packs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "RUF"]
ignore = [
    "E501",   # line length handled separately
    "RUF001", # UI glyphs and scraped/job text legitimately contain Unicode symbols
    "RUF002",
    "RUF003",
]
