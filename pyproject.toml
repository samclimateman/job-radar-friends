[project]
name = "job-radar"
version = "0.1.4"
description = "Local-first career opportunity radar"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "feedparser>=6.0.12",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "python-multipart>=0.0.32",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "pyinstaller>=6.21.0",
]

[project.scripts]
job-radar = "job_radar.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["job_radar*"]

[tool.setuptools.package-data]
job_radar = ["db/schema.sql", "db/migrations/*.sql", "ui/templates/*.html", "ui/static/*", "source_packs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "RUF"]
ignore = [
    "E501",   # line length handled separately
    "RUF001", # UI glyphs and scraped/job text legitimately contain Unicode symbols
    "RUF002",
    "RUF003",
]
