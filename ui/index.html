<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Job Radar</title>
  <style>
    body { margin: 0; background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; color: #1a1f2e; }
    .card { background: white; border-radius: 12px; padding: 32px 36px; max-width: 440px; box-shadow: 0 4px 24px rgba(0,0,0,.08); text-align: center; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.02em; }
    p { font-size: 13px; color: #667085; line-height: 1.6; margin: 0 0 16px; }
    code { background: #f0f2f5; border-radius: 4px; padding: 1px 5px; font-size: 12px; }
    .spinner { width: 32px; height: 32px; border: 3px solid #dde1ea; border-top-color: #3b5bdb; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { font-size: 12px; color: #3b5bdb; font-weight: 600; }
    .error { display: none; color: #9f241d; background: #ffe1de; border-radius: 8px; padding: 12px 14px; font-size: 12.5px; text-align: left; line-height: 1.55; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1>Job Radar</h1>
    <p>Starting dashboard&hellip;</p>
    <div id="status">Connecting</div>
    <div class="error" id="error-box">
      <strong>Dashboard did not start.</strong><br><br>
      Check <code>~/.job-radar/startup.log</code> for details.
    </div>
  </div>
  <script>
    var port = 8766;
    var attempts = 0;
    var max = 24;
    function check() {
      fetch('http://127.0.0.1:' + port + '/', { mode: 'no-cors' })
        .then(function() { window.location = 'http://127.0.0.1:' + port + '/'; })
        .catch(function() {
          attempts++;
          document.getElementById('status').textContent = 'Connecting (' + attempts + ')';
          if (attempts >= max) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('error-box').style.display = 'block';
            document.getElementById('status').textContent = 'Failed to connect';
          } else {
            setTimeout(check, 500);
          }
        });
    }
    setTimeout(check, 800);
  </script>
</body>
</html>
