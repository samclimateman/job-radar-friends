name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [windows-installer]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python sidecar (PyInstaller)
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -e . pyinstaller
          .venv\Scripts\pyinstaller job-radar-server.spec --noconfirm

      - name: Smoke-test sidecar binary
        run: |
          $proc = Start-Process -FilePath "dist\job-radar-server\job-radar-server.exe" -ArgumentList "start","--no-open","--port","8766" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $resp = Invoke-RestMethod -Uri "http://127.0.0.1:8766/api/health" -TimeoutSec 2
              if ($resp.app -eq "job-radar") { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Sidecar did not serve /api/health within 30s" }
          Write-Host "Sidecar healthy."

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build NSIS installer
        run: npx --yes "@tauri-apps/cli@^2" build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-radar-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" (Get-Item "src-tauri/target/release/bundle/nsis/*.exe") --clobber
