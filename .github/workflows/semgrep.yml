name: Semgrep

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "47 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep Community Edition
        run: semgrep scan --config p/security-audit --metrics=off .
